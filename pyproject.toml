[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kick-ass-loop-engineer"
version = "3.2.1"
description = "kickAssLoopEngineer — autonomous loop-engineering build/verify/review loop, governed."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Alpha AI" }]
keywords = ["agents", "llm", "loop", "claude", "ollama", "autonomous", "codegen"]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
keyring = ["keyring==25.7.0"]

[project.scripts]
loop-engineer = "kickass_loop_engineer.cli:main"
kickass = "kickass_loop_engineer.cli:main"

[project.urls]
Homepage = "https://github.com/Patibandha/kick-ass-loop-engineer"
Issues = "https://github.com/Patibandha/kick-ass-loop-engineer/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/kickass_loop_engineer"]

[tool.pytest.ini_options]
markers = ["slow: long-running integration tests"]
